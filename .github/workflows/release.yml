# Release automática: cada push na main (commit direto ou PR mergeada) gera uma tag semver e uma release no GitHub.
# A versão sobe pelos commits desde a última tag (Conventional Commits). Escreva [skip release] na mensagem para pular.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Uma release por vez: dois pushes seguidos não disputam o mesmo número de versão.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico e tags completos para calcular a versão

      - name: Calcular a próxima versão
        id: version
        run: |
          set -euo pipefail

          # Reexecução do mesmo commit: ele já tem tag, nada a fazer.
          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)

          if [ -z "$last" ]; then
            next="v0.1.0" # primeira release
          else
            msgs=$(git log "$last..HEAD" --format='%s%n%b')
            IFS=. read -r major minor patch <<< "${last#v}"
            if echo "$msgs" | grep -Eq '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE'; then
              next="v$((major + 1)).0.0"
            elif echo "$msgs" | grep -Eq '^feat(\([^)]*\))?:'; then
              next="v${major}.$((minor + 1)).0"
            else
              next="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"

      - name: Criar a tag e a release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          LAST: ${{ steps.version.outputs.last }}
        run: |
          set -euo pipefail
          args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [ -n "$LAST" ]; then args+=(--notes-start-tag "$LAST"); fi
          gh release create "$TAG" "${args[@]}"
